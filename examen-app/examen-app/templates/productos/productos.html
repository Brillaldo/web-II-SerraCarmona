<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/agregar_eventos.css' %}">
</head>
<body>
    {% include 'base/header.html' %}
    <main>
        <div class="container">
            <h1>{{ titulo }}</h1>
            <p>Total de Productos: {{ total_productos }}</p>
            <div class="productos-list">
                {% for producto in productos %}
                    <div class="producto-item">
                        <h2>{{ producto.name }}</h2>
                        <p>Precio: ${{ producto.precio }}</p>
                        <p>Localidad: {{ producto.localidad }}</p>
                    </div>
                {% endfor %}
            </div>
        </div>
    </main>
    {% include 'base/footer.html' %}
</body>
</html>
